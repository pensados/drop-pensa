# Example nginx vhost for drop-pensa.
#
# This config assumes:
# - drop-pensa is running locally bound to 127.0.0.1:8019 (the default
#   in docker-compose.yml).
# - TLS is terminated by nginx with a certificate at the paths below;
#   adjust them for your setup (Let's Encrypt, Cloudflare Origin Cert,
#   self-signed for testing, etc.).
# - The reverse proxy sets X-Forwarded-* headers; uvicorn is started
#   with proxy_headers=True so it honors them.
#
# Drop this file in /etc/nginx/sites-available/, symlink into
# sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.

upstream drop_pensa_backend {
    server 127.0.0.1:8019;
    keepalive 10;
}

server {
    listen 80;
    listen [::]:80;
    server_name drop.example.com;

    # Always upgrade to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drop.example.com;

    ssl_certificate     /etc/letsencrypt/live/drop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.example.com/privkey.pem;

    # HSTS — strong default. Remove or shorten if you're not committed
    # to HTTPS-only for this hostname.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 60m gives the app a chance to enforce its own 50 MB limit cleanly,
    # rather than nginx returning a stock 413 first.
    client_max_body_size 60m;

    # Disable buffering so streamed downloads start serving immediately
    # rather than waiting for nginx to buffer the whole response. This
    # also lets the app abort uploads mid-stream when the client lies
    # about Content-Length.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://drop_pensa_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Generous timeouts: large uploads on slow links can take a while.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_redirect off;
    }
}
