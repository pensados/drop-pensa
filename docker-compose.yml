version: "3.8"

services:
  drop-pensa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-pensa
    ports:
      - "127.0.0.1:8019:8000"
    volumes:
      - drop-storage:/var/lib/drop-pensa
    environment:
      - DEBUG=false
      - STORAGE_DIR=/var/lib/drop-pensa/files
      - DB_URL=sqlite:////var/lib/drop-pensa/drop.db
      - MAX_FILE_SIZE_MB=50
      - DEFAULT_TTL_SECONDS=3600
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - drop-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: drop-redis
    networks:
      - drop-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  drop-storage:
    driver: local

networks:
  drop-network:
    driver: bridge
